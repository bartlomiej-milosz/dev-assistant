services:
  db:
    image: pgvector/pgvector:0.8.1-pg17
    environment:
      POSTGRES_DB: assistant
      POSTGRES_USER: assistant
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run make init-env first}
    ports:
      - "127.0.0.1:${DB_PORT:-55438}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assistant -d assistant"]
      interval: 2s
      timeout: 3s
      retries: 30
  cli:
    profiles: ["cli"]
    build: .
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_PASSWORD: ${DB_PASSWORD}
      OLLAMA_URL: http://host.docker.internal:11434
      EMBED_MODEL: ${EMBED_MODEL:-all-minilm}
      CHAT_MODEL: ${CHAT_MODEL:-qwen3.5:9b}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./sources.toml:/app/sources.toml:ro
volumes:
  postgres-data:
