[project]
name = "dev-assistant"
version = "0.1.0"
description = "A local assistant for quickly finding information across large collections of personal study notes."
readme = "README.md"
authors = [
    { name = "Bartłomiej Miłosz", email = "bartlomiej.milosz@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
dev-assistant = "dev_assistant:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "ty>=0.0.99",
]
