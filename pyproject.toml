[project]
name = "dev-assistant"
version = "0.1.0"
description = "A local repository Q&A project with source citations and retrieval evaluation."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = []

[project.scripts]
dev-assistant = "dev_assistant.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=9", "ruff>=0.17", "ty>=0.0.99"]
notebooks = ["ipykernel>=7"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["I"]
